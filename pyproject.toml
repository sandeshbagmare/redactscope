[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redactscope"
version = "0.1.0"
description = "Redact and audit secrets in agent messages and tool results before they reach a model"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sandesh Bagmare" }]
keywords = ["agents", "llm", "security", "redaction", "secrets"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
redactscope = "redactscope.__main__:main"

[project.urls]
Homepage = "https://github.com/sandeshbagmare/redactscope"
Issues = "https://github.com/sandeshbagmare/redactscope/issues"
Changelog = "https://github.com/sandeshbagmare/redactscope/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/redactscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
